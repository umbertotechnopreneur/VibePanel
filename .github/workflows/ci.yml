name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-stage
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}\artifacts\nuget-http
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore ThermalrightVibeWare.slnx -p:Platform=${{ matrix.arch }}
      - name: Verify restored dependency scan evidence
        shell: pwsh
        run: ./scripts/Assert-DefenderClean.ps1 -Path $env:NUGET_PACKAGES -Source 'https://api.nuget.org/v3/index.json; restored package archives and extracted dependencies'
      # The vendored LibreHardwareMonitor source follows its upstream formatting.
      - run: dotnet format ThermalrightVibeWare.slnx --verify-no-changes --no-restore --exclude third_party/LibreHardwareMonitor
      - run: dotnet build ThermalrightVibeWare.slnx --configuration Release --no-restore --warnaserror -p:Platform=${{ matrix.arch }}
      - name: Offline state and provider checks
        if: matrix.arch == 'x64'
        run: dotnet run --project tests/ThermalrightVibeWare.StudioChecks -c Release
      - name: Publish portable folders (no tests)
        shell: pwsh
        run: ./scripts/Publish.ps1 -Architecture ${{ matrix.arch }}
      - name: Build Windows installer
        shell: pwsh
        run: |
          $payloads = @(Get-ChildItem -LiteralPath artifacts/staging -Directory)
          if ($payloads.Count -ne 1) { throw 'Expected exactly one fresh published payload.' }
          ./scripts/Build-Msi.ps1 -PayloadPath $payloads[0].FullName -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ThermalrightVibeWare-win-${{ matrix.arch }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.msi
          if-no-files-found: error
  linux-ui:
    name: Linux UI and offline model checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/ThermalrightVibeWare.Photino/ThermalrightVibeWare.Photino.csproj
      - run: dotnet build src/ThermalrightVibeWare.Photino/ThermalrightVibeWare.Photino.csproj --configuration Release --no-restore --warnaserror
      - name: Offline state and provider checks (no hardware)
        run: dotnet run --project tests/ThermalrightVibeWare.StudioChecks -c Release
  required:
    name: Build
    if: always()
    needs: [build, linux-ui]
    runs-on: windows-latest
    steps:
      - name: Require both Windows builds
        shell: pwsh
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ needs.linux-ui.result }}' -ne 'success') { throw 'A required Windows or Linux build failed or was cancelled.' }
